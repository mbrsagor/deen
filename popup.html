<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 280px;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      color: #2c3e50;
      text-align: center;
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #219a52;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #7f8c8d;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <h2>Eye Care Settings</h2>
  
  <div class="control-group">
    <label for="interval">Work Time (minutes):</label>
    <input type="number" id="interval" min="1" max="120" value="20">
  </div>

  <div class="control-group">
    <label for="breakDuration">Break Time (minutes):</label>
    <input type="number" id="breakDuration" min="1" max="30" value="2">
  </div>
  
  <button id="saveBtn">Save & Restart Timer</button>
  
  <div id="statusMsg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
